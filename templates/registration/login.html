{% extends "base.html" %}
{# Django's LoginView checks the username and password. #}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="panel form-panel narrow">
  <h1>Log in</h1>
  <p class="page-subtitle">Welcome back. Log in to request or manage equipment.</p>
  <form method="post" class="stacked-form" novalidate>
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="button button-primary button-large" type="submit">Log in</button>
  </form>
  <p class="form-footer">New starter? <a href="{% url 'register' %}">Create an account</a>.</p>
</section>
{% endblock %}
